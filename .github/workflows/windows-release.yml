name: Windows Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing shared release tag, e.g. v1.1.25'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch tar unzip curl diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-zlib
      - name: Build pinned OpenConnect with Windows control bridge
        shell: msys2 {0}
        run: bash Apps/Windows/scripts/build-engine.sh
      - name: Test release publication guards
        shell: pwsh
        run: ./scripts/windows/test-release.ps1
      - name: Build and verify release packages
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/release-windows.ps1 prepare -Tag $env:RELEASE_TAG
          $version=(& ./scripts/windows/version.ps1).Version
          "delivery_path=dist/windows-release-$version/delivery" >> $env:GITHUB_OUTPUT
      - name: Verify installed SYSTEM service without a VPN connection
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version=(& ./scripts/windows/version.ps1).Version
          $payload="./dist/windows-release-$version/windows-x64"
          try {
            & "$payload/install.ps1"
            if ($LASTEXITCODE) { throw 'Installation failed; service test cannot proceed' }
            dotnet run --project Apps/Windows/XDVPN.Platform.Tests -c Release -- --service
            if ($LASTEXITCODE) { throw 'Service smoke test failed' }
          } finally {
            if (Get-Service XDVPN -ErrorAction SilentlyContinue) { & "$payload/uninstall.ps1" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ steps.package.outputs.delivery_path }}/*
          if-no-files-found: error
          retention-days: 14
