name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v1.1.24'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
  BUILD_CHANNEL: release

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag, clean checkout and release ordering
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          python3 scripts/version.py --check-git
          python3 scripts/github-release.py check
          python3 -m unittest discover -s Tests/ReleaseTests -v
          bash scripts/test-packaging.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARCHS: ${{ matrix.arch }}
      NOTARIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build/openconnect/downloads
          key: openconnect-sources-${{ hashFiles('scripts/build-openconnect.sh') }}
      - name: Configure company signing and mandatory notarization
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash scripts/ci-signing.sh
      - name: Build application and test native runtime
        run: |
          bash scripts/build.sh
          bash scripts/test.sh -c release
          VERSION="$(python3 scripts/version.py --field version)"
          python3 scripts/verify-bundled-engine.py "build/XD VPN $VERSION-$ARCHS.app" --arch "$ARCHS"
      - name: Package tested application
        run: |
          VERSION="$(python3 scripts/version.py --field version)"
          SKIP_BUILD=1 APP_OUTPUT="$PWD/build/XD VPN $VERSION-$ARCHS.app" bash scripts/package.sh
          if [ "$ARCHS" = arm64 ]; then
            tar -czf build/third-party-sources.tar.gz -C .build/openconnect downloads
          fi
      # Internal build artifacts include checksums and source archives.
      # github-release.py publishes the two architecture DMGs and the Android APK.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/*.dmg
            build/*.sha256
            build/third-party-sources.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/xdvpn-signing.keychain-db" || true

  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: Apps/Android/.build/engine/downloads
          key: android-sources-${{ hashFiles('Apps/Android/scripts/build-engine.sh') }}
      # A runner-generated debug key would change with every run and break in-place upgrades,
      # so the release keystore must come from repository secrets.
      - name: Configure Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see docs/releasing.md).' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xdvpn-release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/xdvpn-release.keystore" >> "$GITHUB_ENV"
      - name: Build, test and verify the Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/release-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            build/*.apk
            build/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/xdvpn-release.keystore"

  publish:
    needs: [build, android]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build
      - name: Publish only after all assets pass SHA-256 verification
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NOTARIZE: '1'
        run: |
          python3 scripts/version.py --check-git
          python3 scripts/release-notes.py > build/release-notes.md
          python3 scripts/github-release.py publish
