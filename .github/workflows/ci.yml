name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build/openconnect/downloads
          key: openconnect-sources-${{ hashFiles('scripts/build-openconnect.sh') }}
      - run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - run: bash scripts/test-packaging.sh
      - run: bash scripts/build.sh
      - run: bash scripts/test.sh -c release
